services:
  - type: web
    name: my-ai-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /tmp/service-account-key.json
      - key: OPENAI_API_KEY
        value: your-openai-api-key
      - key: PYTHON_VERSION
        value: 3.10.13
